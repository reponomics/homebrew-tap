name: Formula CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-install:
    name: Source install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_DEVELOPER: "1"
    steps:
      - name: Set up Homebrew and check out the tested commit
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          stable: true
      - name: Validate and install formula
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          if [ ! -f Formula/treestamp.rb ]; then
            echo "Tap bootstrap: no formula to test yet."
            exit 0
          fi
          brew style reponomics/tap/treestamp
          brew install --build-from-source reponomics/tap/treestamp
          brew test reponomics/tap/treestamp
          brew audit --strict --online reponomics/tap/treestamp
